<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QDII 基金申购额度</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #111827;
    --muted: #5b6472;
    --line: #e4e7ec;
    --rule: #cfd4dc;
    --paper: #ffffff;
    --accent: #1e3a5f;
    --open: #0f6b5c;
    --limit: #8a5a00;
    --pause: #a33a2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.6 "IBM Plex Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: var(--paper);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

  header { padding: 28px 0 18px; }
  h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .meta { margin-top: 4px; color: var(--muted); font-size: 13px; }

  /* 筛选区：吸顶，桌面端一行一组，移动端自然堆叠 */
  .bar {
    position: sticky; top: 0; z-index: 10;
    background: var(--paper);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .bar .wrap { display: grid; gap: 12px; padding-top: 14px; padding-bottom: 14px; }
  .field { display: grid; grid-template-columns: 72px 1fr; align-items: center; gap: 12px; }
  .field-label { color: var(--muted); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font: inherit; font-size: 13px; line-height: 1.4;
    padding: 5px 12px;
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s;
  }
  .chip:hover { border-color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
  .tools label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .tools input[type="number"] { width: 96px; }
  .tools input[type="text"] { width: 200px; }
  input {
    font: inherit; font-size: 13px;
    padding: 5px 8px;
    color: var(--ink); background: var(--paper);
    border: 1px solid var(--rule); border-radius: 6px;
  }
  .count { margin-left: auto; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 表格 */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; }
  th, td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    text-align: left; vertical-align: middle;
    white-space: nowrap;
  }
  thead th { font-weight: 500; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--rule); }
  .sort {
    font: inherit; color: inherit;
    background: none; border: 0; padding: 0; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
  }
  th[aria-sort="ascending"] .sort::after { content: "↑"; }
  th[aria-sort="descending"] .sort::after { content: "↓"; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  td.name { white-space: normal; min-width: 220px; }
  td.name a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--rule); }
  td.name a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .code { color: var(--muted); font-variant-numeric: tabular-nums; }
  .cat {
    display: inline-block; margin-right: 4px;
    padding: 1px 8px; font-size: 12px;
    color: var(--accent); border: 1px solid var(--line); border-radius: 6px;
  }
  .st { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
  .st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .st-open { color: var(--open); }
  .st-limit { color: var(--limit); }
  .st-pause { color: var(--pause); }
  .empty { padding: 48px 0; text-align: center; color: var(--muted); }

  @media (max-width: 640px) {
    .bar { position: static; }
    .field { grid-template-columns: 1fr; gap: 6px; }
    .count { margin-left: 0; width: 100%; }
    .tools input[type="text"] { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<header class="wrap">
  <h1>QDII 基金申购额度</h1>
  <div class="meta" id="updated">加载中…</div>
</header>

<div class="bar">
  <div class="wrap">
    <div class="field">
      <span class="field-label" id="lbl-status">申购状态</span>
      <div class="chips" role="group" aria-labelledby="lbl-status" data-group="status">
        <button type="button" class="chip" data-value="buyable" aria-pressed="true">可申购</button>
        <button type="button" class="chip" data-value="open" aria-pressed="false">仅开放</button>
        <button type="button" class="chip" data-value="limit" aria-pressed="false">仅限大额</button>
        <button type="button" class="chip" data-value="pause" aria-pressed="false">暂停</button>
        <button type="button" class="chip" data-value="all" aria-pressed="false">全部</button>
      </div>
    </div>

    <div class="field">
      <span class="field-label" id="lbl-cat">分类</span>
      <div class="chips" role="group" aria-labelledby="lbl-cat" data-group="cat">
        <button type="button" class="chip" data-value="all" aria-pressed="true">全部</button>
        <button type="button" class="chip" data-value="标普500" aria-pressed="false">标普 500</button>
        <button type="button" class="chip" data-value="纳指" aria-pressed="false">纳指</button>
      </div>
    </div>

    <div class="tools">
      <label>单日额度不低于
        <input type="number" id="min" value="100" min="0" step="any" aria-label="单日额度下限（元）"> 元
      </label>
      <label><input type="checkbox" id="unknown"> 显示额度未公布或未取到的限大额基金</label>
      <label>搜索
        <input type="text" id="q" placeholder="代码或基金名称">
      </label>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
  </div>
</div>

<main class="wrap">
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th scope="col" aria-sort="none"><button type="button" class="sort" data-key="code">代码</button></th>
          <th scope="col" aria-sort="none"><button type="button" class="sort" data-key="name">基金简称</button></th>
          <th scope="col" aria-sort="none"><button type="button" class="sort" data-key="categories">分类</button></th>
          <th scope="col" aria-sort="none"><button type="button" class="sort" data-key="sgzt">申购状态</button></th>
          <th scope="col" class="num" aria-sort="descending"><button type="button" class="sort" data-key="limit_yuan">单日额度</button></th>
          <th scope="col" aria-sort="none"><button type="button" class="sort" data-key="shzt">赎回状态</button></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="empty" id="empty" hidden>没有符合条件的基金。可以降低额度下限，或清空搜索。</div>
</main>

<script>
const state = { funds: [], status: "buyable", cat: "all", sortKey: "limit_yuan", sortDir: -1 };
const $ = (id) => document.getElementById(id);

const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ESC[c]);

// 额度数值：开放申购视为无限额（Infinity）；限大额取解析出的元数；未取到为 null
function quotaOf(f) {
  if (f.sgzt === "开放") return Infinity;
  if (f.limit_yuan == null) return null;
  return f.limit_yuan;
}

function passes(f) {
  const min = parseFloat($("min").value);
  const q = $("q").value.trim().toLowerCase();
  const quota = quotaOf(f);
  const s = state.status;

  if (state.cat !== "all" && !(f.categories || []).includes(state.cat)) return false;
  if (s === "buyable" && f.sgzt !== "开放" && f.sgzt !== "限大额") return false;
  if (s === "open" && f.sgzt !== "开放") return false;
  if (s === "limit" && f.sgzt !== "限大额") return false;
  if (s === "pause" && f.sgzt !== "暂停") return false;

  // 额度下限只作用于限大额基金；开放申购（无限额）始终满足
  if (f.sgzt === "限大额" && !isNaN(min)) {
    if (quota === null) return $("unknown").checked;
    if (quota < min) return false;
  }
  if (q && !(f.code.includes(q) || f.name.toLowerCase().includes(q))) return false;
  return true;
}

function sortValue(f, key) {
  if (key === "limit_yuan") {
    const v = quotaOf(f);
    return v === null ? -1 : v;
  }
  if (key === "categories") return (f.categories || []).join(",");
  if (key === "name") return f.name;
  return (f[key] || "").toString();
}

function rowHtml(f) {
  const cls = f.sgzt === "开放" ? "open" : f.sgzt === "限大额" ? "limit" : "pause";
  const quota = f.sgzt === "开放" ? "无限额" : (f.limit_text || "未取到");
  const cats = (f.categories || []).map((c) => `<span class="cat">${esc(c)}</span>`).join("");
  return `<tr>
    <td class="code">${esc(f.code)}</td>
    <td class="name"><a href="https://fund.eastmoney.com/${esc(f.code)}.html" target="_blank" rel="noopener">${esc(f.name)}</a></td>
    <td>${cats}</td>
    <td><span class="st st-${cls}">${esc(f.sgzt)}</span></td>
    <td class="num">${esc(quota)}</td>
    <td>${esc(f.shzt)}</td>
  </tr>`;
}

function render() {
  const rows = state.funds.filter(passes).sort((a, b) => {
    const x = sortValue(a, state.sortKey), y = sortValue(b, state.sortKey);
    return (x > y ? 1 : x < y ? -1 : 0) * state.sortDir;
  });
  $("count").textContent = `显示 ${rows.length} / ${state.funds.length} 只`;
  $("empty").hidden = rows.length > 0;
  $("rows").innerHTML = rows.map(rowHtml).join("");

  document.querySelectorAll(".sort").forEach((btn) => {
    const active = btn.dataset.key === state.sortKey;
    btn.closest("th").setAttribute("aria-sort",
      active ? (state.sortDir > 0 ? "ascending" : "descending") : "none");
  });
}

// 标签组：点击即切换，单选，用 aria-pressed 表达选中状态
document.querySelectorAll(".chips").forEach((group) => {
  group.addEventListener("click", (e) => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    state[group.dataset.group] = btn.dataset.value;
    group.querySelectorAll(".chip").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
    render();
  });
});

document.querySelectorAll(".sort").forEach((btn) => {
  btn.addEventListener("click", () => {
    const key = btn.dataset.key;
    state.sortDir = state.sortKey === key ? -state.sortDir : (key === "limit_yuan" ? -1 : 1);
    state.sortKey = key;
    render();
  });
});

$("min").addEventListener("input", render);
$("q").addEventListener("input", render);
$("unknown").addEventListener("change", render);

fetch("data.json", { cache: "no-cache" })
  .then((r) => r.json())
  .then((d) => {
    state.funds = d.funds;
    $("updated").textContent = `数据更新于 ${d.updated} · 来源：天天基金网`;
    render();
  })
  .catch(() => { $("updated").textContent = "数据加载失败，请稍后刷新"; });
</script>
</body>
</html>
